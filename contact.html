<main id="main-content">
<header class="page-heading container"><p class="eyebrow">Let’s connect</p><h1>Contact me</h1><p class="lead">Send a message using the accessible form below.</p></header>
<section class="container section" aria-labelledby="form-title">
<h2 id="form-title">Send a message</h2>
<form class="contact-form" action="#" method="post">
<div class="field"><label for="name">Full name <span aria-hidden="true">*</span></label><input id="name" name="name" type="text" autocomplete="name" required></div>
<div class="field"><label for="email">Email address <span aria-hidden="true">*</span></label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-help"><small id="email-help">Use a valid email address.</small></div>
<div class="field"><label for="subject">Subject <span aria-hidden="true">*</span></label><input id="subject" name="subject" type="text" required></div>
<div class="field"><label for="message">Message <span aria-hidden="true">*</span></label><textarea id="message" name="message" rows="6" required></textarea></div>
<button class="button" type="submit">Send message</button>
<p id="form-status" role="status" aria-live="polite"></p>
</form>
</section>
</main>
